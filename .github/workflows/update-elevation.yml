name: Elevation Call Updater

on:
  schedule:
    # Cron is UTC. The call runs Mondays 7:00-8:00 PM ET, so these slots are
    # all Monday *evening* ET even though the UTC day is Tuesday:
    #   01:00 UTC Tue = 9 PM Mon EDT / 8 PM Mon EST
    #   02:00 UTC Tue = 10 PM Mon EDT / 9 PM Mon EST
    #   03:00 UTC Tue = 11 PM Mon EDT / 10 PM Mon EST (final attempt)
    # The script bails unless it's a Monday in ET, and it's idempotent, so
    # extra runs are no-ops and later slots double as retries if Grain is
    # slow to process the recording.
    - cron: "0 1 * * 2"
    - cron: "0 2 * * 2"
    - cron: "0 3 * * 2"
  workflow_dispatch:        # Stream Deck button / manual run
    inputs:
      check_only:
        description: "Self-check credentials only (no changes to elevation.json)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # A button press (workflow_dispatch) that actually posted the replay makes the
  # scheduled slots stand down. Only *successful* manual runs count, and the
  # updater fails a manual run that finds nothing - so a press that came too
  # early never suppresses the schedule. 12h keeps a press the day before from
  # counting (cron slots can fire hours late, so it's not tighter).
  check-manual-run:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - name: Skip if a manual run already posted this one
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cutoff=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          count=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/update-elevation.yml/runs?event=workflow_dispatch&status=success&created=%3E${cutoff}" \
            --jq '.total_count')
          if [ "$count" -gt 0 ]; then
            echo "Manual run already handled this ($count since $cutoff) - skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: check-manual-run
    if: needs.check-manual-run.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests anthropic

      - name: Update elevation.json from Grain
        env:
          GRAIN_API_TOKEN_V2: ${{ secrets.GRAIN_API_TOKEN_V2 }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          FINAL_ATTEMPT: ${{ github.event.schedule == '0 3 * * 2' && 'true' || 'false' }}
          CHECK_ONLY: ${{ inputs.check_only && 'true' || 'false' }}
        run: python scripts/update_elevation.py

      # Runs even if the step above failed (e.g. a button press that found no new
      # call) so an earlier call that is still missing its recap gets written.
      - name: Write topic + recap for any call missing one
        if: ${{ !cancelled() && !inputs.check_only }}
        env:
          GRAIN_API_TOKEN_V2: ${{ secrets.GRAIN_API_TOKEN_V2 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/write_recap.py

      - name: Commit and push if changed
        if: ${{ !cancelled() && !inputs.check_only }}
        run: |
          git config user.name "elevation-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet elevation.json; then
            git add elevation.json
            git commit -m "Update Elevation Call replays ($(date +%Y-%m-%d))"
            git push
          else
            echo "No changes to commit."
          fi
